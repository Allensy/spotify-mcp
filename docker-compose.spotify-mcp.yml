services:
  spotify-mcp:
    image: docker.io/allesy/spotify-mcp:latest
    container_name: spotify-mcp
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_SSE_PATH: /sse
      SPOTIPY_CLIENT_ID: ${SPOTIPY_CLIENT_ID}
      SPOTIPY_CLIENT_SECRET: ${SPOTIPY_CLIENT_SECRET}
      SPOTIPY_REDIRECT_URI: ${SPOTIPY_REDIRECT_URI:-http://127.0.0.1:8888/callback}
      SPOTIPY_CACHE_PATH: /app/.cache/token
    volumes:
      - ${SPOTIFY_MCP_CACHE_DIR:-${HOME}/.cache/spotify-mcp}:/app/.cache
    ports:
      - "${SPOTIFY_MCP_PORT:-8000}:8000"
